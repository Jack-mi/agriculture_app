<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A4 立体田：等距积木农场，金色地块长高了一截 -->
  <rect width="1024" height="1024" rx="220" fill="#F6E7C6"/>
  <ellipse cx="512" cy="780" rx="330" ry="46" fill="#E3DCCB"/>
  <!-- 后排两块绿地 -->
  <g>
    <polygon points="512,300 662,375 512,450 362,375" fill="#2E5B34"/>
    <polygon points="362,375 512,450 512,486 362,411" fill="#24492A"/>
    <polygon points="662,375 512,450 512,486 662,411" fill="#1F4024"/>
