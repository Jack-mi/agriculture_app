    <path d="M512 660 v-52 m0 14 c-18 -4 -27 -17 -29 -34 m29 21 c18 -4 27 -17 29 -34"/>
    <path d="M452 692 v-40 m0 11 c-14 -3 -21 -13 -23 -26 m23 16 c14 -3 21 -13 23 -26"/>
    <path d="M572 692 v-40 m0 11 c-14 -3 -21 -13 -23 -26 m23 16 c14 -3 21 -13 23 -26"/>
