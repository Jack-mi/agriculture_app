    <ellipse cx="452" cy="392" rx="34" ry="72" transform="rotate(38 452 392)"/>
    <ellipse cx="572" cy="392" rx="34" ry="72" transform="rotate(-38 572 392)"/>
    <ellipse cx="442" cy="512" rx="34" ry="76" transform="rotate(42 442 512)"/>
