  <rect x="182" y="182" width="660" height="660" rx="120" fill="#B3372B"/>
  <!-- 茎 -->
  <line x1="512" y1="752" x2="512" y2="310" stroke="#FFFDF7" stroke-width="30" stroke-linecap="round"/>
  <!-- 麦粒：左右各三对饱满籽粒 -->
